services:
  app:
    build: .
    container_name: portfolio_app
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/portfolio_system
      MONGODB_DB: portfolio_system
      AUTH_SECRET: change-this-secret-before-production
      ADMIN_EMAIL: admin@pfs.local
      ADMIN_PASSWORD: Admin@1234
      NEXT_PUBLIC_APP_URL: http://localhost:3001
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: portfolio_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
